<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff1744" />
      <stop offset="100%" stop-color="#b71c1c" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="100" height="100" rx="20" fill="#0d0d11" />
  <rect x="2" y="2" width="96" height="96" rx="18" fill="none" stroke="url(#grad)" stroke-width="2" />
  
  <!-- Stylized Heist Mask / Code brackets -->
  <path d="M 25 35 L 40 50 L 25 65" fill="none" stroke="#ff1744" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" />
  <path d="M 75 35 L 60 50 L 75 65" fill="none" stroke="#ff1744" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" />
  <circle cx="50" cy="50" r="6" fill="#ff5252" filter="url(#glow)" />
  <path d="M 35 25 L 65 25" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
  <path d="M 40 75 L 60 75" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
</svg>
